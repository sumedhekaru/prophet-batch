name: CI

# Public repo (Actions minutes are free): on every push and pull request to main, and by hand.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash  # also on Windows (Git Bash): the wheel step uses POSIX syntax
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tests (PyPI prophet 1.5.0)
        run: >
          uv run --isolated --no-project --python ${{ matrix.python-version }}
          --with prophet==1.5.0 --with pytest --with pytest-timeout --with-editable .
          pytest -q -p no:cacheprovider
      - name: Docs (snippets run, test references exist, docstrings)
        run: >
          uv run --isolated --no-project --python ${{ matrix.python-version }}
          --with prophet==1.5.0 --with-editable . python tools/check_docs.py
      - name: Wheel builds and installs
        run: |
          uv build
          cd /tmp && uv run --isolated --no-project --python ${{ matrix.python-version }} \
            --with prophet==1.5.0 --with "$GITHUB_WORKSPACE"/dist/*.whl \
            python "$GITHUB_WORKSPACE"/tools/smoke.py

  oldest:
    # The oldest supported stack (requires-python and the numpy / pandas floors in pyproject): the matrix above
    # resolves the newest versions only, and bugs on old pandas (categorical ids) went unseen there.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tests (Python 3.10, numpy 1.21.6, pandas 1.3.5)
        env:
          OPENBLAS_NUM_THREADS: "1"  # numpy 1.x's OpenBLAS can hang on some CPUs (README, Limitations)
        run: >
          uv run --isolated --no-project --python 3.10
          --with prophet==1.5.0 --with numpy==1.21.6 --with pandas==1.3.5 --with pytest --with pytest-timeout
          --with-editable . pytest -q -p no:cacheprovider

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: pyrefly (upstream's version)
        run: >
          uv run --isolated --no-project --python 3.12 --with prophet==1.5.0 --with pyrefly==0.50.0
          pyrefly check
