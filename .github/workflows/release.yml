name: Release

# Push a tag vX.Y.Z (matching pyproject's version): build once, publish to TestPyPI, then, after a maintainer approves
# the `pypi` environment (required reviewer), to PyPI. Trusted publishing: no tokens are stored.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag matches the package version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata and README rendering
        run: uvx twine check dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          cd /tmp && uv run --isolated --no-project --python 3.12 --with prophet==1.5.0 \
            --with "$GITHUB_WORKSPACE"/dist/*.whl python "$GITHUB_WORKSPACE"/tools/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/prophet-batch
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: testpypi
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/prophet-batch
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
