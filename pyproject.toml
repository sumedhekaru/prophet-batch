[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "prophet-batch"
version = "0.1.0"
description = "Fit and forecast many Prophet models at once: batched exact MAP fits, seeded parallel forecasts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sumedhe Karunarathne" }]
dependencies = [
  "prophet>=1.5,<2",  # the seeded predict path mirrors 1.5's sampling code (tools/sync_seeded.py)
  "numpy>=1.21.6",
  "pandas>=1.3.5",
]
keywords = ["prophet", "forecasting", "time series", "batch", "parallel"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/sumedhekaru/prophet-batch"
Documentation = "https://github.com/sumedhekaru/prophet-batch/blob/main/docs/guarantees.md"
Examples = "https://github.com/sumedhekaru/prophet-batch-examples"
Issues = "https://github.com/sumedhekaru/prophet-batch/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyrefly]
project-includes = ["src/prophet_batch"]
python-version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600  # pytest-timeout; the property tests fit dozens of random models
