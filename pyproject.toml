[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "prophet-batch"
version = "0.1.0.dev0"
description = "Fit and forecast many Prophet models at once: batched exact MAP fits, seeded parallel forecasts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sumedhe Karunarathne" }]
dependencies = [
  "prophet>=1.5",
  "numpy>=1.21.6",
  "pandas>=1.3.5",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyrefly]
project-includes = ["src/prophet_batch"]
python-version = "3.10"
